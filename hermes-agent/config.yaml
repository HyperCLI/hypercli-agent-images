_config_version: 33

model:
  provider: custom:hypercli
  default: kimi-k2.6-anthropic

providers:
  hypercli:
    name: HyperCLI
    api: ${env:HYPER_AGENTS_API_BASE}
    key_env: HYPER_AGENTS_API_KEY
    transport: anthropic_messages

gateway:
  platforms:
    api_server:
      extra:
        model_name: kimi-k2.6-anthropic
        model_routes:
          kimi-k2.6-anthropic:
            provider: custom:hypercli
            model: kimi-k2.6-anthropic
